<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribunal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0c14; --panel:#16111e; --surface:#1e1828; --surface2:#271f33; --line:#2f2640; --line2:#3d3252;
  --ink:#f4eee3; --muted:#a397b4; --faint:#6f6582; --gold:#e8c15a; --gold2:#b8922f; --acc:#d97757;
  --ok:#5cc26b; --mid:#e9b23a; --no:#e0574f; --info:#6aa7e8;
  --r:12px; --sh:0 10px 30px rgba(0,0,0,.45);
  --px:'Pixelify Sans',ui-monospace,monospace; --tx:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--tx);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:var(--tx);color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--surface2);border-color:var(--faint)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;min-height:600px}

/* topo */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line)}
.lingBox{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.lingBox>span{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--faint)}
.ling{display:flex;border:1px solid var(--line2);border-radius:99px;padding:2px;flex:none}
.ling button{border:none;background:none;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.ling button.on{background:var(--gold);color:#1a1220}
abbr.termo{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.marca{font-family:var(--px);font-size:22px;letter-spacing:.5px;color:var(--gold);display:flex;align-items:center;gap:8px;flex:none}
.titulo{flex:1;min-width:0}
.titulo b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vivo{display:none;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--no);letter-spacing:.5px;flex:none}
.vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--no);animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{opacity:.25}}

/* linha do tempo */
.linha{display:flex;gap:4px;padding:10px 20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.linha::-webkit-scrollbar{display:none}
.passo{flex:1 0 auto;min-width:88px;display:flex;flex-direction:column;gap:6px;background:none;border:none;padding:4px 6px;text-align:left;border-radius:6px}
.passo:hover{background:var(--surface);border:none}
.passo .barra{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;display:block}
.passo .barra i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.passo small{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.passo.feito .barra i{width:100%}
.passo.feito small{color:var(--muted)}
.passo.agora small{color:var(--gold)}
.passo.falta{cursor:default;opacity:.55}
.passo.falta:hover{background:none}
.passo.agora .barra i{width:40%;animation:enche 1.6s ease-in-out infinite alternate}
@keyframes enche{to{width:90%}}

/* corpo */
.corpo{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.palco{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px 20px;gap:12px}
.tela{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.moldura{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh),0 0 0 1px var(--line2)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.sobre{position:absolute;inset:0;pointer-events:none}
.cartaoFase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;transition:opacity .35s,transform .35s;background:rgba(15,12,20,.93);border:1px solid var(--gold2);border-radius:14px;padding:18px 26px;width:min(520px,86%);text-align:center;box-shadow:var(--sh);pointer-events:none}
.cartaoFase.ve{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cartaoFase .n{font-family:var(--px);color:var(--gold);font-size:13px;letter-spacing:1px}
.cartaoFase h2{font-family:var(--px);font-size:30px;margin:4px 0 6px;font-weight:700}
.cartaoFase p{margin:0;color:var(--muted);font-size:15px}
.placarTela{position:absolute;left:12px;top:12px;display:none;gap:12px;align-items:center;background:rgba(15,12,20,.9);border:1px solid var(--line2);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:700}
.placarTela .rot{color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-size:10.5px}
.placarTela b{display:flex;align-items:center;gap:5px;white-space:nowrap}
.placarTela b i{width:8px;height:8px;border-radius:2px;display:inline-block}
.etiqueta{position:absolute;transform:translate(-50%,-100%);background:rgba(15,12,20,.92);border:1px solid var(--line2);color:var(--ink);font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;white-space:nowrap}

/* legenda (lower third) */
.legenda{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-height:96px;cursor:pointer}
.legenda canvas{width:64px;height:64px;border-radius:10px;background:var(--surface2)}
.quem{display:flex;align-items:center;gap:8px;margin-bottom:3px;min-width:0}
.quem b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.papel{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.papel.juiz{background:rgba(232,193,90,.15);color:var(--gold)}
.papel.promotor{background:rgba(224,87,79,.15);color:#f08a83}
.papel.defesa{background:rgba(106,167,232,.15);color:#8dbdf0}
.papel.jurado{background:rgba(217,119,87,.15);color:#ec9b80}
.papel.perito{background:rgba(92,194,107,.15);color:#86d892}
.fala{font-size:17px;line-height:1.45;min-height:1.45em}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;vertical-align:2px;letter-spacing:.3px}
.cursor{display:inline-block;width:7px;height:1.05em;background:var(--gold);vertical-align:-2px;margin-left:2px;animation:pisca 1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}

/* controles */
.controles{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grupo{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.grupo button{border:none;background:none;padding:6px 10px;border-radius:7px}
.grupo button.on{background:var(--gold);color:#1a1322}
.grupo button:hover:not(.on){background:var(--surface2)}
.dica{margin-left:auto;color:var(--faint);font-size:12px}
kbd{font-family:var(--tx);font-size:11px;background:var(--surface2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px}

/* painel lateral */
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.abas{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.abas button{flex:1;background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:12px 4px;color:var(--muted);font-size:13px}
.abas button.on{color:var(--ink);border-bottom-color:var(--gold)}
.abas button:hover{background:none;color:var(--ink)}
.conteudo{flex:1;overflow:auto;padding:16px}
.secao{margin-bottom:20px}
.secao h3{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:700}
.opc{margin-bottom:10px}
.opc .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
.opc .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opc .t{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.opc .t i{display:block;height:100%;width:0;border-radius:4px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.cod{font-style:normal;font-size:10px;font-weight:700;color:var(--faint);background:var(--surface2);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.glos{display:flex;gap:10px;margin-bottom:10px;font-size:13px}
.glos>i{flex:none;width:10px;height:10px;border-radius:3px;margin-top:4px}
.glos p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.nota{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.nota b{color:var(--ink)}
.grade{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.jur{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 3px 5px;text-align:center;cursor:pointer;transition:border-color .2s,transform .15s}
.jur:hover{border-color:var(--faint)}
.jur canvas{width:40px;height:40px;margin:0 auto}
.jur small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jur .voto{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--line2)}
.jur.conselho{border-color:var(--gold2)}
.jur.conselho::after{content:"★";position:absolute;top:2px;left:5px;font-size:10px;color:var(--gold)}
.jur.recusado{opacity:.4}
.jur.reforco{border-style:dashed}
.jur.destaque{transform:scale(1.08);border-color:var(--gold)}
.prova{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:border-color .3s,background .3s}
.prova.agora{border-color:var(--gold);background:rgba(232,193,90,.07)}
.prova .cab{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.prova .id{font-family:var(--px);color:var(--gold);font-size:14px}
.tag{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.no{background:rgba(224,87,79,.15);color:#f08a83}
.prova p{margin:0;font-size:13px}
.prova .fonte{color:var(--faint);font-size:11.5px;margin-top:4px;word-break:break-word}
.ata p{margin:0 0 10px;font-size:13px}
.ata .f{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--gold);text-transform:uppercase;margin:16px 0 8px}
.ata .q{color:var(--muted)}

/* gaveta da ficha */
.gaveta{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);background:var(--panel);border-left:1px solid var(--line2);box-shadow:var(--sh);transform:translateX(105%);transition:transform .25s ease;z-index:20;display:flex;flex-direction:column}
.gaveta.aberta{transform:none}
.gaveta .cab{display:flex;gap:14px;align-items:center;padding:18px;border-bottom:1px solid var(--line)}
.gaveta .cab canvas{width:72px;height:72px;border-radius:12px;background:var(--surface2);flex:none}
.gaveta .cab b{font-size:17px;display:block}
.gaveta .cab span{color:var(--muted);font-size:13px}
.gaveta .corpoG{padding:18px;overflow:auto}
.gaveta dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13px}
.gaveta dt{color:var(--faint)}
.gaveta dd{margin:0}
.gaveta .vt{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.gaveta .vt q{display:block;color:var(--muted);margin-top:4px;font-style:italic}
.fechar{margin-left:auto}

/* véus: início, malhete, sentença */
.veu{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,14,.74);backdrop-filter:blur(2px);z-index:5;padding:16px}
.veu.ve{display:flex}
.janela{background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--sh);padding:22px 24px;max-width:560px;width:100%;max-height:100%;overflow:auto}
.janela .sup{font-family:var(--px);color:var(--gold);letter-spacing:1px;font-size:13px}
.janela h1{font-size:21px;line-height:1.3;margin:6px 0 10px}
.janela p{color:var(--muted);margin:0 0 12px}
.etapas{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.etapas span{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:3px 9px;border-radius:99px}
.cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grande{background:var(--gold);color:#1a1322;border-color:var(--gold);font-size:15px;padding:11px 18px}
.grande:hover{background:#f2cf6c;border-color:#f2cf6c}
.cta small{color:var(--faint)}
.veredito{text-align:center}
.anel{width:132px;height:132px;margin:8px auto 4px;display:block}
.veredito h1{font-family:var(--px);font-size:24px;margin:4px 0 2px}
.veredito .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.blocos{text-align:left;display:grid;gap:10px}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.bloco h4{margin:0 0 4px;font-size:11px;letter-spacing:.6px;color:var(--faint);text-transform:uppercase}
.bloco ul{margin:0;padding-left:18px}
.carimbo{display:inline-block;margin-top:14px;border:2px solid var(--ok);color:var(--ok);font-family:var(--px);font-size:14px;padding:5px 10px;border-radius:6px;transform:rotate(-3deg)}
.carimbo.rec{border-color:var(--no);color:var(--no)}

@media (max-width:980px){
  .app{height:auto;min-height:0}
  .corpo{grid-template-columns:1fr}
  .tela{min-height:240px}
  aside{border-left:none;border-top:1px solid var(--line)}
  .conteudo{max-height:60vh}
  .dica{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="marca">⚖ TRIBUNAL</div>
    <div class="titulo"><b id="tTitulo"></b><span id="tPergunta"></span></div>
    <div class="vivo" id="vivo">AO VIVO</div>
    <div class="lingBox"><span id="lingRot">Linguagem</span><div class="ling" role="group" aria-labelledby="lingRot"><button data-ling="tribunal" title="Termos de tribunal: veredito, conselho, réplica…">Tribunal</button><button data-ling="natural" title="Palavras do dia a dia, sem jargão">Natural</button></div></div>
  </header>
  <nav class="linha" id="linha" aria-label="Fases do julgamento"></nav>
  <div class="corpo">
    <main class="palco">
      <div class="tela" id="tela">
        <div class="moldura" id="moldura">
          <canvas id="cv" width="480" height="270" aria-label="Sala do tribunal"></canvas>
          <div class="sobre" id="sobre"></div>
          <div class="placarTela" id="placarTela"></div>
          <div class="cartaoFase" id="cartaoFase" role="status"></div>
          <div class="veu" id="veuInicio"></div>
          <div class="veu" id="veuMalhete"><div class="janela" style="text-align:center;max-width:380px">
            <div class="sup" id="supMalhete">A SENTENÇA VAI SER LIDA</div>
            <p style="margin-top:8px">O navegador bloqueou o som. Bata o malhete para ouvir.</p>
            <div class="cta" style="justify-content:center"><button class="grande" id="bMalhete">🔨 Bater o malhete</button></div>
          </div></div>
          <div class="veu" id="veuFinal"><div class="janela veredito" id="janelaFinal"></div></div>
        </div>
      </div>
      <div class="legenda" id="legenda" title="Clique para completar a fala">
        <canvas id="retrato" width="32" height="32"></canvas>
        <div style="min-width:0">
          <div class="quem"><b id="lgNome">Tribunal</b><span class="papel" id="lgPapel">sessão</span></div>
          <div class="fala" id="lgFala" aria-live="polite">Clique em <b>Assistir ao julgamento</b> para começar.</div>
        </div>
      </div>
      <div class="controles">
        <div class="grupo">
          <button id="bVolta" title="Fase anterior (←)" aria-label="Fase anterior">⏮</button>
          <button id="bPlay" title="Pausar (espaço)" aria-label="Pausar">⏸</button>
          <button id="bAvanca" title="Próxima fase (→)" aria-label="Próxima fase">⏭</button>
        </div>
        <div class="grupo" role="group" aria-label="Velocidade">
          <button data-v="1" class="on">1×</button><button data-v="2">2×</button><button data-v="4">4×</button>
        </div>
        <div class="grupo">
          <button id="bSom" title="Som (M)" aria-label="Som">🔊</button>
          <button id="bFim" title="Ir para a sentença">Sentença</button>
          <button id="bDeNovo" title="Recomeçar" aria-label="Recomeçar">↺</button>
        </div>
        <span class="dica"><kbd>espaço</kbd> pausa · <kbd>←</kbd> <kbd>→</kbd> fases · clique em alguém para ver a ficha</span>
      </div>
    </main>
    <aside>
      <div class="abas" role="tablist">
        <button data-aba="placar" class="on" role="tab">Placar</button>
        <button data-aba="juri" role="tab">Júri</button>
        <button data-aba="provas" role="tab">Provas</button>
        <button data-aba="ata" role="tab">Ata</button>
      </div>
      <div class="conteudo" id="conteudo"></div>
    </aside>
  </div>
</div>
<div class="gaveta" id="gaveta" aria-hidden="true"></div>

<script id="dados" type="application/json">__DADOS__</script>
<script>
(() => {
'use strict';
let D;
try { D = JSON.parse(document.getElementById('dados').textContent); }
catch (e) { document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">Este é o modelo da sala. Gere a de um caso com <code>python tribunal.py abrir</code>.</p>'; return; }

// ================================================================ dados
// linguagem: 'tribunal' (termos do rito) ou 'natural' (dia a dia; 'simples' é o nome antigo). Só a apresentação muda; os autos não.
const TERMOS = D.termos || {};
let LING = D.linguagem || 'tribunal'; try { LING = localStorage.getItem('tribunal:linguagem') || LING; } catch (e) {}
// ?linguagem=natural e ?fase=N (1 = abertura) abrem a sala direto num ponto: útil para links e capturas de tela
const URLQ = new URLSearchParams(location.search); if (['tribunal', 'natural'].includes(URLQ.get('linguagem'))) LING = URLQ.get('linguagem');
if (LING === 'simples') LING = 'natural';
const SIMPLES = LING === 'natural';
const T = k => TERMOS[k] ? TERMOS[k][SIMPLES ? 1 : 0] : k;
const S2 = (trib, simp) => SIMPLES ? simp : trib;
// no modo tribunal, o termo ganha a explicação natural ao passar o mouse
const TD = k => (!SIMPLES && TERMOS[k] && TERMOS[k][1] !== TERMOS[k][0]) ? '<abbr class="termo" title="' + esc(TERMOS[k][1]) + '">' + esc(T(k)) + '</abbr>' : esc(T(k));
const A = D.autos, CASO = A.caso, JURI = A.juri || {}, S = A.sentenca, PL = D.placar || {};
const OPC = (CASO.opcoes && CASO.opcoes.length) ? CASO.opcoes : ['Procedente', 'Procedente com condições', 'Improcedente'];
const COR = ['#5cc26b', '#e9b23a', '#e0574f', '#6aa7e8', '#b48ae8'];
const corOpc = v => COR[Math.max(0, OPC.indexOf(v))] || '#888';
const ICO = ['ok', 'meio', 'nao', 'ok', 'meio'];
const icoOpc = v => ICO[Math.max(0, OPC.indexOf(v))] || 'meio';
// nomes legíveis: "X1: Julgamento como transmissão…" vira o apelido da proposta ("Transmissão de jogo");
// "Status quo: …" vira "Deixar como está". O código (X1) só aparece pequeno, ao lado.
const APELIDO = {}; (A.propostas || []).forEach(p => { if (p.apelido) APELIDO[p.id] = p.apelido; });
const codigo = o => { const m = String(o).match(/^([A-Z]\d+)\s*:/); return m ? m[1] : ''; };
const descricaoOpc = o => { const s = String(o); const i = s.indexOf(':'); return codigo(o) || /^status quo/i.test(s) ? s.slice(i + 1).trim() : ''; };
function rotulo(o) {

  const c = Math.max(0, Math.min(100, +S.confianca || 0)), Rr = 54, L2 = 2 * Math.PI * Rr, cor = c >= 70 ? '#5cc26b' : c >= 50 ? '#e9b23a' : '#e0574f';
  const d = A.decisao_usuario || {}, e2 = PL.estabilidade2;
  const p = r => OPC.map((o, i) => '<b style="color:' + COR[i] + '">' + (cont[r][o] || 0) + '</b>').join(' · ');
  const lista = xs => '<ul>' + xs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  const b = (t, x) => (x && (!Array.isArray(x) || x.length)) ? '<div class="bloco"><h4>' + t + '</h4>' + (Array.isArray(x) ? lista(x) : esc(x)) + '</div>' : '';
  document.getElementById('janelaFinal').innerHTML =
    '<div class="sup">' + esc(T('sentenca').toUpperCase()) + '</div>' +
    '<svg class="anel" viewBox="0 0 132 132" role="img" aria-label="Confiança ' + c + '%"><circle cx="66" cy="66" r="' + Rr + '" fill="none" stroke="#2f2640" stroke-width="12"/><circle cx="66" cy="66" r="' + Rr + '" fill="none" stroke="' + cor + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (L2 * c / 100) + ' ' + L2 + '" transform="rotate(-90 66 66)"/><text x="66" y="66" text-anchor="middle" fill="#f4eee3" font-family="Pixelify Sans, monospace" font-size="30">' + c + '%</text><text x="66" y="86" text-anchor="middle" fill="#a397b4" font-family="Inter, sans-serif" font-size="11">' + esc(T('confianca')) + '</text></svg>' +
    '<h1>' + esc(rotulo(S.veredito)) + '</h1>' + (codigo(S.veredito) ? '<div class="sub" style="margin:-2px 0 6px">' + esc(descricaoOpc(S.veredito)) + '</div>' : '') +
    '<div class="sub">' + esc(T('conselho_curto')) + ' ' + p(2) + ' &nbsp;·&nbsp; ' + esc(T('sala')) + ' ' + p(1) + (e2 && e2.n ? ' &nbsp;·&nbsp; firme em ' + pct(e2.estabilidade) + ' das reamostragens' : '') + '</div>' +
    '<div class="blocos">' + b(T('proximo_passo'), S.proximo_passo) + b(T('condicoes'), S.condicoes) + b(T('ponto_de_virada'), S.ponto_de_virada) + b(T('criterio_de_abandono'), S.criterio_de_abandono) + b(T('voto_vencido'), S.voto_vencido) + '</div>' +
    (d.acatou === true ? '<span class="carimbo">' + esc(T('acatada')) + '</span>' : d.acatou === false ? '<span class="carimbo rec">' + esc(T('recurso')) + '</span>' : '') +
    '<div class="cta" style="justify-content:center;margin-top:16px"><button id="fRever">↺ Rever o julgamento</button><button id="fSala">Ver a sala</button></div>';
  document.getElementById('veuFinal').classList.add('ve');
  document.getElementById('fSala').onclick = () => document.getElementById('veuFinal').classList.remove('ve');
  document.getElementById('fRever').onclick = () => irPara(0);
  legendaFixa(S2('Sessão encerrada', 'Fim'), T('sentenca').toLowerCase(), 'juiz', '<b>' + esc(rotulo(S.veredito)) + '</b> · ' + esc(T('confianca')) + ' ' + esc(S.confianca) + '%', OFICIAIS.juiz);
}

// ================================================================ vida na sala
function vida(dt) {
  if (!ocioso || veloz()) return;
  for (const c of P) {
    if (c.oficial || !c.visivel || c.rota.length) continue;
    const j = JUR[c.id], pe = j.personalidade || {}, livre = !(c.icone && c.iconeAte > relogio), ch = p => Math.random() < p * dt;
    if (ch(0.22)) c.olho = [-1, 0, 0, 1][Math.floor(Math.random() * 4)];
    if (!livre) continue;
    if (c.L.celular && ch(0.04)) c.celularAte = relogio + 2.5;
    else if (j.idade >= 75 && ch(0.025)) marcar(c, 'zz', 3000);
    else if ((pe['estabilidade emocional'] || 3) <= 2 && ch(0.03)) marcar(c, 'gota', 1500);
    else if ((pe['extroversão'] || 3) >= 4 && ch(0.025)) { pular(c); marcar(c, 'pts', 1400); }
    else if (j.idade < 14 && ch(0.05)) pular(c);
  }
}

// ================================================================ laço
const sombra = document.createElement('canvas'); sombra.width = W; sombra.height = H; const gs = sombra.getContext('2d');
let ultimo = performance.now();
function desenhar(c) {
  const anda = c.rota.length > 0, t = relogio + c.semente;
  const sobe = (c.pulo > 0 ? Math.round(Math.sin((1 - c.pulo / 0.35) * Math.PI) * 4) : 0) + (anda && Math.floor(t * 8) % 2 ? 1 : 0);
  if (c.brilho > 0) { g.fillStyle = 'rgba(232,193,90,' + (0.28 + 0.18 * Math.sin(relogio * 10)) + ')'; g.fillRect(Math.round(c.x) - 11, Math.round(c.y) - 24, 22, 26); }
  const cx = sprite(g, c.L, Math.round(c.x), Math.round(c.y), { sobe, anda, passo: Math.floor(t * 8) % 2, olho: c.olho, lado: c.lado,
    falando: c.falando > 0 && Math.floor(relogio * 6) % 2 === 1, pisca: (t % 4) < 0.12, celular: c.celularAte > relogio, selo: c.selo });
  c._caixa = cx; c._cx = [Math.round(c.x), cx[1] - 4];
}
function quadro(agora) {
  let dt = Math.min(0.1, (agora - ultimo) / 1000); ultimo = agora;
  if (pausado) dt = 0; dt *= veloz() ? 1 : vel; relogio += dt;
  for (let i = esperas.length - 1; i >= 0; i--) if (esperas[i].ate <= relogio) esperas.splice(i, 1)[0].r();
  for (const c of P) {
    c.pulo = Math.max(0, c.pulo - dt); c.brilho = Math.max(0, c.brilho - dt); c.falando = Math.max(0, c.falando - dt);
    if (c.rota.length) {
      const [tx, ty] = c.rota[0], dx = tx - c.x, dy = ty - c.y, dd = Math.hypot(dx, dy), ps = c.vel * dt;
      if (Math.abs(dx) > 0.5) c.lado = dx > 0 ? 1 : -1;
      if (dd <= ps) { c.x = tx; c.y = ty; c.rota.shift(); if (!c.rota.length && c.chegou) { const f = c.chegou; c.chegou = null; f(); } }
      else { c.x += dx / dd * ps; c.y += dy / dd * ps; }
    }
  }
  vida(dt); tickLegenda();
  g.drawImage(fundo, 0, 0);
  P.filter(c => c.visivel).map(c => ({ y: c.y, d: () => desenhar(c) })).concat(ADERECOS).sort((a, b) => a.y - b.y).forEach(i => i.d());
  const fs = focos.filter(c => c && c.visivel);
  if (fs.length && !veloz()) {
    gs.globalCompositeOperation = 'source-over'; gs.clearRect(0, 0, W, H); gs.fillStyle = 'rgba(8,6,12,.52)'; gs.fillRect(0, 0, W, H);
    gs.globalCompositeOperation = 'destination-out';
    for (const c of fs) { const gr = gs.createRadialGradient(c.x, c.y - 9, 5, c.x, c.y - 9, 34); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); gs.fillStyle = gr; gs.fillRect(c.x - 40, c.y - 50, 80, 82); }
    g.drawImage(sombra, 0, 0);
  }
  for (const c of P) if (c.visivel && c.icone && c.iconeAte > relogio && c._cx) icone(g, c.icone, c._cx[0], c._cx[1]);
  for (const c of fs) if (c.falando > 0 && c._cx && !(c.icone && c.iconeAte > relogio)) icone(g, 'fala', c._cx[0], c._cx[1] + (Math.floor(relogio * 3) % 2));
  for (let i = etiquetas.length - 1; i >= 0; i--) { const e = etiquetas[i]; if (e.ate <= relogio) { e.b.remove(); etiquetas.splice(i, 1); } else { e.b.style.left = (e.c.x * ESC) + 'px'; e.b.style.top = ((e.c.y - 25) * ESC) + 'px'; } }
  requestAnimationFrame(quadro);
}

// ================================================================ interação
function quem(ev) {
  const r = cv.getBoundingClientRect(), mx = (ev.clientX - r.left) / ESC, my = (ev.clientY - r.top) / ESC;
  let m = null; for (const c of P) { if (!c.visivel || !c._caixa) continue; const [x, y, w, h] = c._caixa; if (mx >= x && mx <= x + w && my >= y && my <= y + h && (!m || c.y > m.y)) m = c; } return m;
}
cv.addEventListener('mousemove', ev => { cv.style.cursor = quem(ev) ? 'pointer' : 'default'; });
cv.addEventListener('click', ev => { const c = quem(ev); if (c) { pular(c); ficha(c); } });
const bPlay = document.getElementById('bPlay');
function pausa(v) { pausado = v == null ? !pausado : v; bPlay.textContent = pausado ? '▶' : '⏸'; bPlay.title = pausado ? 'Continuar (espaço)' : 'Pausar (espaço)'; bPlay.setAttribute('aria-label', pausado ? 'Continuar' : 'Pausar'); }
bPlay.onclick = () => pausa();
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { vel = +b.dataset.v; document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); });
const bSom = document.getElementById('bSom');
bSom.onclick = () => { som = !som; bSom.textContent = som ? '🔊' : '🔇'; if (som) { ligarAudio(); batida(false); } };
document.addEventListener('pointerdown', ligarAudio);
let faseAtual = 0;
function pularFase() { pulando = true; esperas.splice(0).forEach(e => e.r()); P.forEach(c => { if (c.rota.length) { const q = c.rota[c.rota.length - 1]; c.x = q[0]; c.y = q[1]; c.rota = []; if (c.chegou) { const f = c.chegou; c.chegou = null; f(); } } }); }
function irPara(i) { i = Math.min(i, PRONTAS - 1); try { sessionStorage.setItem(CHAVE + ':ir', String(Math.max(0, i))); } catch (e) {} location.reload(); }
document.getElementById('bAvanca').onclick = pularFase;
document.getElementById('bVolta').onclick = () => irPara(Math.max(0, faseAtual - 1));
document.getElementById('bFim').onclick = () => irPara(DISP.length - 1);
document.getElementById('bDeNovo').onclick = () => { try { sessionStorage.removeItem(CHAVE); } catch (e) {} irPara(0); };
document.addEventListener('keydown', e => {
  if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); pausa(); }
  else if (e.key === 'ArrowRight') pularFase();
  else if (e.key === 'ArrowLeft') irPara(Math.max(0, faseAtual - 1));
  else if (e.key === 'm' || e.key === 'M') bSom.click();
  else if (e.key === 'Escape') fecharFicha();
});

// ================================================================ início
function telaInicio() {
  const v = document.getElementById('veuInicio');
  v.innerHTML = '<div class="janela"><div class="sup">⚖ ' + S2('UM JULGAMENTO EM ', 'UMA DECISÃO EM ') + DISP.length + S2(' FASES', ' ETAPAS') + '</div><h1>' + esc(CASO.pergunta || CASO.titulo) + '</h1>' +
    '<p>' + convocados.length + ' pessoas comuns, sorteadas de um elenco que representa o Brasil pelo IBGE, votam em segredo. ' + S2('Um promotor ataca, a defesa defende, e o juiz dá a sentença.', 'Um lado procura problemas, o outro defende, e o juiz dá a decisão final.') + '</p>' +
    '<div class="etapas">' + DISP.map(f => '<span>' + esc(f.nome) + '</span>').join('') + '</div>' +
    '<div class="cta"><button class="grande" id="bComecar">▶ Assistir ao julgamento</button><small>com som · <kbd>espaço</kbd> pausa · <kbd>→</kbd> pula fase</small></div></div>';
  v.classList.add('ve');
  return new Promise(r => { const b = document.getElementById('bComecar'); b.focus(); b.onclick = () => { ligarAudio(); v.classList.remove('ve'); r(); }; });
}
async function rodar() {
  ajustar(); sala(); render(); requestAnimationFrame(quadro);
  let ir = null, feitas = 0;
  if (URLQ.get('fase')) ir = Math.max(0, Math.min(PRONTAS - 1, (+URLQ.get('fase') || 1) - 1));
  try { const x = sessionStorage.getItem(CHAVE + ':ir'); if (x != null) { ir = +x; sessionStorage.removeItem(CHAVE + ':ir'); } if (D.ao_vivo) feitas = +(sessionStorage.getItem(CHAVE) || 0); } catch (e) {}
  const inicio = ir != null ? ir : feitas;
  if (inicio === 0 && ir == null) await telaInicio();
  for (let i = 0; i < PRONTAS; i++) {
    if (!DISP[i].ok()) { fasesFeitas.add(DISP[i].k); continue; }
    faseAtual = i;
    turbo = i < inicio;
    await abrirFase(i);
    await ROT[DISP[i].k]();
    fasesFeitas.add(DISP[i].k);
    if (veloz()) P.forEach(c => { c.icone = null; c.brilho = 0; c.pulo = 0; });   // fase pulada: nada de ícone preso
    turbo = false; pulando = false; focos = [];
    etiquetas.splice(0).forEach(e => e.b.remove());
    render();
    if (D.ao_vivo) { try { sessionStorage.setItem(CHAVE, String(i + 1)); } catch (e) {} }
  }
  marcarLinha(PRONTAS); ocioso = true;
  if (D.ao_vivo) {
    document.getElementById('vivo').style.display = 'flex';
    legendaFixa('Sessão em andamento', 'ao vivo', '', 'Aguardando a próxima fase… a sala atualiza sozinha.', null);
    setTimeout(() => location.reload(), 6000);
  }
}
rodar();
})();
